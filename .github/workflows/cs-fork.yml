name: RTLab CS fork validation
on:
  workflow_dispatch:
  push:
    branches: ['dev/cs-1.9-rt-host']
    paths: ['fork/**', '.github/workflows/cs-fork.yml']
permissions:
  contents: read
concurrency:
  group: cs-fork-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bridge:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test streaming build diagnostics
        run: python fork/tests/test_process_log.py
      - name: Configure standalone bridge
        run: cmake -S fork -B fork/build -A x64
      - name: Compile module and tests
        run: cmake --build fork/build --config Release --parallel 2
      - name: Test ABI and WARP resource audit (not hardware RT)
        run: ctest --test-dir fork/build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RTLab-Bridge-Test-Logs
          path: fork/build/Testing/Temporary/*.log
  host:
    needs: bridge
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==4.2.3 ninja
      - name: Compile patched CS 1.9.0 host
        run: python fork/scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RTLab-CS-Fork-Build-Evidence
          path: |
            fork/out/*.log
            fork/out/*.json
            fork/out/*.txt
            fork/_work/build-cs/CMakeFiles/CMakeConfigureLog.yaml
            fork/_work/build-cs/vcpkg-manifest-install.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FalkosLichtspiel-MO2-and-Sources
          path: |
            fork/out/FalkosLichtspiel-MO2.zip
            fork/out/FalkosLichtspiel-Sources.zip
            fork/out/SHA256.json
          if-no-files-found: error
